name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/dataverse-swa-dashboard]

# Least-privilege; add more only if a job needs it.
permissions:
  contents: read

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package.json
            package-lock.json
            api/package.json
            api/package-lock.json

      - name: Validate JSON configs
        run: |
          echo "--- staticwebapp.config.json ---"
          node -e "JSON.parse(require('fs').readFileSync('staticwebapp.config.json','utf8')); console.log('staticwebapp.config.json: OK')"
          echo "--- api/host.json ---"
          node -e "JSON.parse(require('fs').readFileSync('api/host.json','utf8')); console.log('api/host.json: OK')"
          echo "--- api/local.settings.json.sample ---"
          node -e "JSON.parse(require('fs').readFileSync('api/local.settings.json.sample','utf8')); console.log('api/local.settings.json.sample: OK')"

      - name: Install (root)
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Install (api)
        if: hashFiles('api/package.json') != ''
        run: npm --prefix api ci

      - name: Lint / typecheck (root)
        if: hashFiles('package.json') != ''
        run: npm run lint 2>&1 || npm run typecheck 2>&1 || npx tsc --noEmit

      - name: Lint / typecheck (api)
        if: hashFiles('api/package.json') != ''
        run: npm --prefix api run typecheck 2>&1 || npm --prefix api run lint 2>&1 || npx --prefix api tsc --noEmit

      - name: Test (root)
        if: hashFiles('package.json') != ''
        run: npm test -- --reporter=verbose 2>&1 || npm test 2>&1 || echo "No root tests"

      - name: Test (api)
        if: hashFiles('api/package.json') != ''
        run: npm --prefix api test -- --reporter=verbose 2>&1 || npm --prefix api test 2>&1 || echo "No api tests"

      - name: Build (root)
        if: hashFiles('package.json') != ''
        run: npm run build

      - name: Build (api)
        if: hashFiles('api/package.json') != ''
        run: npm --prefix api run build

      - name: Bundle secret scan (no Dataverse secret in dist)
        if: hashFiles('dist/**') != '' || hashFiles('api/dist/**') != ''
        run: |
          echo "Scanning dist/ for leaked secrets (should be empty)..."
          ! grep -R -i "DATAVERSE_CLIENT_SECRET" dist/ 2>/dev/null || (echo "FAIL: DATAVERSE_CLIENT_SECRET found in dist/" && exit 1)
          ! grep -R "sk_live\|client_secret" api/dist/ 2>/dev/null || echo "WARN: suspicious token-like string in api/dist (review)"
          echo "Bundle scan: OK"

      - name: Summary
        if: always()
        run: echo "CI pipeline finished (see job logs for lint/typecheck/test/build status)."
